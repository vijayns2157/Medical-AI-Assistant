services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medical-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: medical-rag-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: medical-rag-backend

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./app:/app/app
      - ./ingestion:/app/ingestion
      - ./guardrails:/app/guardrails
      - ./data:/app/data

    depends_on:
      - qdrant
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: medical-rag-frontend

    command: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

    ports:
      - "8501:8501"

    volumes:
      - ./frontend:/app/frontend

    depends_on:
      - backend


volumes:
  qdrant_data: